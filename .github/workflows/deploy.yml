name: Sunway ERP Backend Deployment

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Application
        run: mvn clean package -DskipTests

      - name: Rename JAR
        run: |
          mkdir deploy
          cp target/*.jar deploy/app.jar

      - name: Upload JAR to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          source: "deploy/app.jar"
          target: "/home/${{ secrets.AZURE_USER }}/apps/sunway"

      - name: Restart Spring Boot Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          script: |
            set -e
            DEPLOY_DIR="/home/${{ secrets.AZURE_USER }}/apps/sunway"

            mv "$DEPLOY_DIR/deploy/app.jar" "$DEPLOY_DIR/app.jar"

            sudo systemctl restart sunway

            echo "Waiting for service to start..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "Service is healthy after ${i}s"
                exit 0
              fi
              sleep 5
            done

            echo "Service did not become healthy within 120s"
            sudo journalctl -u sunway -n 50 --no-pager
            exit 1
