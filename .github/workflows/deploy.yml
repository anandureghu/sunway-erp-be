# Deploy Sunway ERP backend to Azure Container Apps on every push to develop.
#
# One-time Azure Portal setup (no local az login):
#   1. Resource group, ACR, Container Apps Environment, Container App
#      (name e.g. sunway-backend, target port 8080, external ingress)
#   2. App registration + client secret for GitHub Actions
#   3. Grant the SP: AcrPush on ACR, Contributor on the resource group
#   4. Set DB/app secrets on the Container App itself (DB_HOST, DB_USER,
#      DB_PASS, AZURE_STORAGE_CONNECTION_STRING, etc.) — this workflow
#      only updates the container image
#
# GitHub repo secrets (Settings → Secrets and variables → Actions):
#   AZURE_CREDENTIALS       {"clientId","clientSecret","subscriptionId","tenantId"}
#   AZURE_RESOURCE_GROUP    e.g. rg-sunway-dev
#   AZURE_CONTAINER_APP_NAME  e.g. sunway-backend
#   ACR_NAME                e.g. sunwayacr  (registry name, not FQDN)
#   ACR_LOGIN_SERVER        e.g. sunwayacr.azurecr.io
#
# After setup: push to develop or run this workflow manually.

name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set image tag
        id: meta
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/sunway-backend"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            .
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.image }}:latest"

      - name: Register ACR on Container App
        run: |
          az containerapp registry set \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --server "${{ secrets.ACR_LOGIN_SERVER }}" \
            --identity system

      # `az containerapp update` only waits for ARM to create a revision — it does
      # NOT wait for the container to start or pass health probes. A crash-loop /
      # image-pull failure still leaves this step green while Azure keeps (or
      # fails) the revision separately. Always verify revision health next.
      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: Verify new revision is healthy
        run: |
          set -euo pipefail
          APP="${{ secrets.AZURE_CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          EXPECTED_TAG="${{ steps.meta.outputs.tag }}"

          # Poll up to ~8 minutes for the revision Azure just created.
          for i in $(seq 1 48); do
            REV=$(az containerapp show -n "$APP" -g "$RG" --query "properties.latestRevisionName" -o tsv)
            IMAGE=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$REV" \
              --query "properties.template.containers[0].image" -o tsv)
            RUNNING=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$REV" \
              --query "properties.runningState" -o tsv)
            HEALTH=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$REV" \
              --query "properties.healthState" -o tsv)
            DETAILS=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$REV" \
              --query "properties.runningStateDetails" -o tsv)

            echo "[$i] revision=$REV running=$RUNNING health=$HEALTH image=$IMAGE"
            if [ -n "$DETAILS" ] && [ "$DETAILS" != "None" ]; then
              echo "  details: $DETAILS"
            fi

            case "$RUNNING" in
              Running|"Running at Max Scale"|"Running (at max)")
                if [ "$HEALTH" = "Healthy" ] || [ "$HEALTH" = "None" ]; then
                  # Confirm we actually rolled the SHA we pushed (not a stale revision).
                  if echo "$IMAGE" | grep -q "$EXPECTED_TAG"; then
                    echo "Revision is healthy on expected image tag."
                    exit 0
                  fi
                  echo "Healthy, but image tag does not match $EXPECTED_TAG yet — waiting…"
                fi
                ;;
              Failed|"Activation Failed"|Degraded)
                echo "::error::Revision $REV failed (running=$RUNNING health=$HEALTH)."
                echo "--- recent console logs ---"
                az containerapp logs show -n "$APP" -g "$RG" --revision "$REV" --tail 80 || true
                echo "--- recent system logs ---"
                az containerapp logs show -n "$APP" -g "$RG" --type system --tail 40 || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for a healthy revision on tag $EXPECTED_TAG."
          az containerapp revision list -n "$APP" -g "$RG" -o table || true
          exit 1

      - name: Logout from Azure
        if: always()
        run: az logout
