<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Payment Receipt</title>
    <style type="text/css">
        @page { size: A4; margin: 24mm; }
        body { font-family: Helvetica, Arial, sans-serif; color: #1f2937; font-size: 13px; }
        .header { border-bottom: 2px solid #e5e7eb; padding-bottom: 16px; margin-bottom: 24px; }
        .company { font-size: 20px; font-weight: bold; }
        .badge { text-align: right; }
        .badge-title { font-size: 11px; text-transform: uppercase; color: #6b7280; }
        .badge-id { font-size: 16px; font-weight: bold; color: #111827; }
        .section { margin-bottom: 20px; }
        .label { font-size: 11px; text-transform: uppercase; color: #6b7280; margin-bottom: 4px; }
        .value { font-weight: 600; }
        table.meta { width: 100%; border-collapse: collapse; }
        table.meta td { padding: 8px 0; vertical-align: top; }
        .amount { font-size: 22px; font-weight: bold; color: #059669; margin-top: 8px; }
        .note { margin-top: 24px; padding: 12px; background: #f9fafb; border-radius: 6px; color: #4b5563; }
    </style>
</head>
<body>
<div class="header">
    <table class="meta">
        <tr>
            <td>
                <div class="company" th:text="${company.companyName}">Company</div>
            </td>
            <td class="badge">
                <div class="badge-title">Payment receipt</div>
                <div class="badge-id" th:text="${payment.paymentCode}">VAP-0001</div>
            </td>
        </tr>
    </table>
</div>

<div class="section">
    <div class="label">Paid to (supplier)</div>
    <div class="value" th:text="${supplierName}">Supplier</div>
</div>

<table class="meta">
    <tr>
        <td width="50%">
            <div class="label">Purchase order</div>
            <div class="value" th:text="${poOrderNumber}">PO-0001</div>
        </td>
        <td width="50%">
            <div class="label">Payment date</div>
            <div class="value" th:text="${#temporals.format(payment.effectiveDate, 'dd/MM/yyyy')}">—</div>
        </td>
    </tr>
    <tr>
        <td>
            <div class="label">Payment method</div>
            <div class="value" th:text="${paymentMethodLabel}">Bank transfer</div>
        </td>
        <td>
            <div class="label">Linked invoice</div>
            <div class="value" th:text="${purchaseInvoiceCode != null ? purchaseInvoiceCode : '—'}">—</div>
        </td>
    </tr>
</table>

<div class="section">
    <div class="label">Amount paid</div>
    <div class="amount" th:text="${#strings.isEmpty(currencyCode)
        ? #numbers.formatDecimal(payment.amount, 1, 'COMMA', 2, 'POINT')
        : currencyCode + ' ' + #numbers.formatDecimal(payment.amount, 1, 'COMMA', 2, 'POINT')}">0.00</div>
</div>

<div class="note" th:if="${payment.notes != null and !#strings.isEmpty(payment.notes)}"
     th:text="${payment.notes}">Notes</div>
<div class="note" th:if="${payment.notes == null or #strings.isEmpty(payment.notes)}">
    This receipt confirms vendor payment for the purchase order listed above.
</div>
</body>
</html>
