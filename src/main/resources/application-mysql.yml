spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hrdb}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&requireSSL=${DB_SSL:false}&verifyServerCertificate=${DB_VERIFY:false}&serverTimezone=UTC${DB_SSL_CA:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASS:Shras@123}
  jpa:
    # ddl-auto is `validate`: Hibernate checks the schema matches the entities
    # but never touches it. All schema changes go through Flyway migrations.
    # Never set this to `update` — Hibernate can add columns but cannot rename
    # or drop them, which causes schema drift (see migration history for examples).
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  # =============================================================================
  # Flyway — versioned schema migrations.
  # Files: src/main/resources/db/migration/V<version>__description.sql
  #
  # V1 creates the full initial schema using CREATE TABLE IF NOT EXISTS, so it
  # is safe to run against an existing database. V20260512 is idempotent via
  # stored-procedure guards. All migrations run from V1 upward on every
  # environment — fresh or existing — without any baseline tricks.
  # =============================================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
