spring:
  profiles:
    active: mysql
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    web:
      pageable:
        default-page-size: 20
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  config:
    import: optional:file:.env[.properties]

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@sunwayerp.local}}
    enabled: ${MAIL_ENABLED:false}
  otp:
    length: 6
    ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
    verification-token-minutes: 15
  jwt:
    secret: "change-this-in-prod-32-bytes-minimum-secret-key-123456"
    issuer: "hrmodule"
    access-token-minutes: 60
    refresh-token-days: 7
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3001,http://localhost:3000,https://api.picominds.com,https://sunway-erp.vercel.app,https://sunwayerp.com,https://demo.sunwayerp.com,https://api.sunwayerp.com"
server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

logging:
  # Console only — WARN/ERROR are persisted to admin_system_logs (see logback-spring.xml).
  # Do not set logging.file.name (no app.log on disk).
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.data.jpa: INFO
    org.hibernate.SQL: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  override-server-url: true

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    public-container: erp-public
    private-container: erp-private
